<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101214">
<title>Rutina gym</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&display=swap">
<style>
/* Layout: lista oscura de una columna con menú de días arriba, filas grandes para tocar con el pulgar */
:root{
  --bg:#101214; --card:#1B1E22; --card2:#23272C; --fg:#F2F3F5; --muted:#8F959D; --line:#2E3339;
  --accent:#FFC21A; --on-accent:#1A1300;
  --font:"Rubik", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:#101214}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:17px;line-height:1.4;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:calc(16px + env(safe-area-inset-top, 0px)) calc(40px + env(safe-area-inset-bottom, 0px))}
.wrap{max-width:540px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.dtab{flex:1;min-width:0;height:44px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--muted);
  font-family:var(--font);font-weight:700;font-size:15px;cursor:pointer;white-space:nowrap;padding:0 10px}
.dtab.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-top:6px}
h1{font-weight:800;font-size:30px;line-height:1.05;margin:0;text-wrap:balance}
.day{color:var(--accent);font-weight:700;font-size:14px;letter-spacing:1.5px;text-transform:uppercase;margin:0 0 4px}
.count{font-weight:800;font-size:30px;font-variant-numeric:tabular-nums;white-space:nowrap}
.count small{font-size:15px;color:var(--muted);font-weight:500}
.track{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.fill{height:100%;width:0;background:var(--accent);transition:width .25s}
h2{font-size:14px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin:14px 0 0}
.ex{background:var(--card);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;margin-top:8px}
.top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.name{font-weight:500;font-size:18px;min-width:0}
.tag{font-size:12px;font-weight:700;color:var(--accent);margin-right:6px}
.scheme{font-weight:700;font-size:17px;white-space:nowrap;font-variant-numeric:tabular-nums}
.note{color:var(--muted);font-size:14px;margin:-4px 0 0}
.sets{display:flex;gap:8px}
.set{flex:1;min-width:0;height:46px;border-radius:10px;border:0;background:var(--card2);color:var(--muted);
  font-family:var(--font);font-weight:700;font-size:15px;cursor:pointer;transition:background .15s,transform .1s}
.set:active{transform:scale(.95)}
.set.on{background:var(--accent);color:var(--on-accent)}
.ex.complete{opacity:.55}
.ex.complete .name{text-decoration:line-through}
.set:focus-visible,.btn:focus-visible,.dtab:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.night{color:var(--muted);font-size:15px;background:var(--card);border-radius:14px;padding:12px 14px}
.night b{color:var(--fg);font-weight:500}
.btn{font-family:var(--font);font-weight:500;font-size:15px;border:1px solid var(--line);background:transparent;color:var(--muted);
  border-radius:10px;padding:10px 14px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;color:var(--fg)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <nav class="days" id="days" aria-label="Día de entrenamiento"></nav>
  <div class="head">
    <div><p class="day" id="dayName"></p><h1 id="title"></h1></div>
    <div class="count" id="count"></div>
  </div>
  <div class="track"><div class="fill" id="fill"></div></div>
  <div id="list"></div>
  <div class="night" id="night"></div>
  <div class="confirm" id="resetBox"></div>
</div>

<script>
const DAYS={
 lunes:{label:"Lunes",wd:1,title:"Pierna + hombro",
  night:"<b>Noche:</b> sin cuerda hoy. Opcional: caminata suave de 20 min.",
  blocks:[
   {h:"Calentamiento",items:[
    {id:"movil",n:"Movilidad cadera, tobillo y hombro",sch:"6–8 min",sets:1}]},
   {h:"Pierna",items:[
    {id:"sent",n:"Sentadilla",sch:"3 × 6",sets:3,note:"2–3 series de aproximación antes."},
    {id:"hack",n:"Hack squat / prensa pies bajos",sch:"3 × 10–12",sets:3,note:"Última al fallo."},
    {id:"ext",n:"Extensión de cuádriceps",sch:"3 × 12–15",sets:3,note:"Dropset en la última."},
    {id:"curl",tag:"4a",n:"Curl femoral sentado",sch:"3 × 15",sets:3,note:"Directo a abductores."},
    {id:"abd",tag:"4b",n:"Abductores en máquina",sch:"2 × 15",sets:2}]},
   {h:"Hombro",items:[
    {id:"press",n:"Press sentado con mancuernas",sch:"4 × 6–8",sets:4},
    {id:"lat",n:"Elevaciones laterales en polea",sch:"3 × 12–15",sets:3},
    {id:"front",tag:"7a",n:"Elevación frontal en polea",sch:"3 × 12–15",sets:3,note:"Directo a pec deck inverso."},
    {id:"rear",tag:"7b",n:"Pec deck inverso",sch:"3 × 15–20",sets:3,note:"Al fallo, pausa 1 s atrás."}]}]},
 martes:{label:"Martes",wd:2,title:"Espalda + bíceps",
  night:"<b>Noche:</b> cuerda según tu progresión (semanas 1–2: 8–10 min, 30 s / 30 s).",
  blocks:[
   {h:"Calentamiento",items:[
    {id:"movil",n:"Movilidad cadera y columna torácica",sch:"6 min",sets:1}]},
   {h:"Espalda",items:[
    {id:"rack",n:"Rack pull (barra bajo la rodilla)",sch:"4 × 5–6",sets:4,note:"2–3 series de aproximación antes."},
    {id:"tbar",n:"Remo en barra T, agarre ancho",sch:"4 × 8–10",sets:4,note:"Codos a 45–60°, aguanta 1–2 s arriba. Libre sin apoyo: 3 series, RIR 1–2."},
    {id:"polea",n:"Remo en polea alta",sch:"3 × 10–12",sets:3},
    {id:"hiper",tag:"4a",n:"Hiperextensiones lastradas",sch:"3 × 12–15",sets:3,note:"Directo a encogimientos."},
    {id:"shrug",tag:"4b",n:"Encogimientos con barra",sch:"3 × 10–12",sets:3,note:"Pausa 2 s arriba."}]},
   {h:"Bíceps",items:[
    {id:"incl",n:"Curl inclinado (banco a 45°)",sch:"3 × 8–12",sets:3,note:"Cabeza larga."},
    {id:"spider",n:"Spider curl",sch:"3 × 10–12",sets:3,note:"Cabeza corta."},
    {id:"martillo",n:"Martillo pesado",sch:"3 × 8–10",sets:3,note:"Braquial."}]}]}
};
const ORDER=Object.keys(DAYS);
const get=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const put=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const today=new Date().getDay();
let cur=(location.hash.slice(1) in DAYS)?location.hash.slice(1):(ORDER.find(k=>DAYS[k].wd===today)||get("gym-last",ORDER[0]));
if(!(cur in DAYS))cur=ORDER[0];
let st={};
const $=id=>document.getElementById(id);

function tabs(){
  $('days').innerHTML="";
  ORDER.forEach(k=>{const b=document.createElement('button');b.className='dtab'+(k===cur?' on':'');
    b.textContent=DAYS[k].label;b.setAttribute('aria-pressed',k===cur);b.onclick=()=>select(k);$('days').appendChild(b)});
}
function select(k){cur=k;put("gym-last",k);try{history.replaceState(null,"","#"+k)}catch(e){}st=get("gym-"+k,{});tabs();render();restore();window.scrollTo(0,0)}

function render(){
  const D=DAYS[cur],all=D.blocks.flatMap(b=>b.items),total=all.reduce((a,x)=>a+x.sets,0);
  $('dayName').textContent=D.label;$('title').textContent=D.title;$('night').innerHTML=D.night;
  const list=$('list');list.innerHTML="";
  D.blocks.forEach(b=>{
    const h=document.createElement('h2');h.textContent=b.h;list.appendChild(h);
    b.items.forEach(x=>{
      const done=st[x.id]||[];
      const c=document.createElement('div');c.className='ex'+(done.filter(Boolean).length===x.sets?' complete':'');
      c.innerHTML=`<div class="top"><div class="name">${x.tag?`<span class="tag">${x.tag}</span>`:""}${x.n}</div><div class="scheme">${x.sch}</div></div>`+(x.note?`<p class="note">${x.note}</p>`:"");
      const row=document.createElement('div');row.className='sets';
      for(let i=0;i<x.sets;i++){
        const s=document.createElement('button');s.className='set'+(done[i]?' on':'');
        s.textContent=x.sets===1?(done[i]?"Hecho":"Marcar"):(done[i]?"✓":"Serie "+(i+1));
        s.setAttribute('aria-pressed',done[i]?'true':'false');
        s.onclick=()=>{const a=st[x.id]||[];a[i]=!a[i];st[x.id]=a;put("gym-"+cur,st);render()};
        row.appendChild(s);
      }
      c.appendChild(row);list.appendChild(c);
    });
  });
  const n=all.reduce((a,x)=>a+(st[x.id]||[]).filter(Boolean).length,0);
  $('fill').style.width=Math.round(n/total*100)+'%';
  $('count').innerHTML=`${n}<small>/${total} series</small>`;
}
const box=$('resetBox');
function restore(){
  box.innerHTML='<button class="btn" id="reset">Reiniciar este día</button>';
  $('reset').onclick=()=>{
    box.innerHTML='<span>¿Borrar lo marcado de '+DAYS[cur].label.toLowerCase()+'?</span><button class="btn primary" id="yes">Sí, reiniciar</button><button class="btn" id="no">Cancelar</button>';
    $('yes').onclick=()=>{st={};put("gym-"+cur,st);render();restore()};
    $('no').onclick=restore;
  };
}
addEventListener('hashchange',()=>{const k=location.hash.slice(1);if(k in DAYS&&k!==cur)select(k)});
try{navigator.wakeLock&&navigator.wakeLock.request('screen').catch(()=>{})}catch(e){}
select(cur);
</script>
</body>
</html>
